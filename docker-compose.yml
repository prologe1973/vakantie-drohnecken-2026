services:
  web:
    image: nginx:alpine
    container_name: vakantie-drohnecken-2026
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./img:/usr/share/nginx/html/img:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
